# cargo-mutants configuration — https://mutants.rs/
#
# Mutation testing measures whether the suite CATCHES bugs, not merely that code
# runs. A surviving mutant is a change to the source that no test noticed — i.e.
# a test that asserts too little. It is the complement to the property tests in
# src/property_tests.rs: those assert the invariants, this proves the assertions
# have teeth.
#
# Run locally:   cargo mutants
# CI:            .github/workflows/mutants.yaml (scheduled + manual; never on
#                PRs — it is slow). Green baseline; red on a real regression.

# The security-critical, in-process vault surface: the crypto core plus the
# I/O-heavier and structural modules — key resolution (env), export scope/policy
# filtering + escaping, agent-grant creation/revoke (grants), recipient
# add/revoke — the who-can-decrypt surface (recipients), agent allow-tag
# enforcement (policy), the three-way merge driver (merge), and secret
# add/rotate/group-scoping (secrets). All are covered
# by the lib tests, so a survivor here is a genuine assertion gap rather than a
# test-tool artifact. The MAC/integrity/load functions (mac.rs, signature.rs,
# load.rs) are mutation-tested by a second, function-scoped invocation in
# mutants.yaml.
examine_globs = [
    "src/crypto.rs",
    "src/signing.rs",
    "src/recovery.rs",
    "src/env.rs",
    "src/export.rs",
    "src/grants.rs",
    "src/recipients.rs",
    "src/policy.rs",
    "src/merge.rs",
    "src/secrets.rs",
]

# Only the lib's unit + property tests need to run to catch mutants in this
# surface; skipping the slow integration/CLI tests keeps each mutant tractable.
additional_cargo_test_args = ["--lib"]

# The baseline lib suite runs in ~2s; give a slow-path (non-hanging) mutant room
# so it is scored as caught/missed, not miscounted as a timeout.
timeout_multiplier = 8.0

# Debug/Display formatting carries no security invariant — the identity Debug
# impls are deliberately lossy (they redact key material), so mutating them is
# noise. Everything else in these modules must be caught.
exclude_re = [
    "impl std::fmt::Debug",
    "impl std::fmt::Display",
]
