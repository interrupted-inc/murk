[package]
name = "murk_lints"
version = "0.1.0"
authors = ["murk maintainers"]
description = "Type-aware secret-handling lints for the murk codebase"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0"
dylint_internal = { version = "6.0", features = ["match_def_path"] }

[dev-dependencies]
dylint_testing = "6.0"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
