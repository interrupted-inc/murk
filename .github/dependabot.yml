version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # codeql-action ships init/analyze as separate "dependencies"; bumping only
    # one leaves a version skew that breaks the CodeQL run. Group them so every
    # codeql-action step moves together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # The fuzz targets are their own workspace with their own lockfile, so the
  # root cargo entry never sees them.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  # Hash-pinned zig toolchain used by the node musl cross-compile job.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
