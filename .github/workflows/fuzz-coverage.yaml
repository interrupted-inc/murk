name: Fuzz Coverage

# Line/region coverage of the fuzz targets, replaying ONLY the tracked seed
# corpus in fuzz/seeds/<target>/ (no live fuzzing) so the numbers are
# deterministic run-to-run. (fuzz/corpus/ — the large evolving corpus — is
# gitignored, so seeds are the committed inputs.) This answers
# "do the seeds actually drive the fuzzer into the parse/merge/recovery logic,
# or just bounce off the first error return?" — a diagnostic, not a gate. It is
# deliberately NOT uploaded to Codecov: coverage-by-fuzzing is weaker than
# coverage-by-assertion and would dilute the unit-test gate. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: fuzz-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: nightly # cargo-fuzz needs nightly; coverage uses llvm-tools
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz # fuzz/ is excluded from the main workspace
      - uses: taiki-e/install-action@f092c064826410a38929a5791d2c0225b94432fe # cargo-fuzz
        with:
          tool: cargo-fuzz

      - name: Replay corpus and render coverage
        run: |
          set -euo pipefail
          targets="fuzz_vault_parse fuzz_env_parse fuzz_merge fuzz_recipient_parse fuzz_recovery"
          # Keep the report to murk's own source: drop the registry, the stdlib,
          # and the fuzz harness shims.
          ignore='/\.cargo/|/rustc/|fuzz/fuzz_targets/'
          # llvm-cov ships with the toolchain (llvm-tools-preview); cargo-binutils
          # `cargo cov` is avoided — its 0.4.0 arg parser panics.
          llvm_cov="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/llvm-cov"
          mkdir -p fuzz-cov
          for t in $targets; do
            echo "::group::coverage $t"
            # Loud guard: a target with no seeds is a gap to fix, not a silent
            # skip — coverage over an empty corpus is meaningless, so fail.
            if [ ! -d "fuzz/seeds/$t" ] || [ -z "$(ls -A "fuzz/seeds/$t" 2>/dev/null)" ]; then
              echo "no seeds in fuzz/seeds/$t — add at least one input" >&2
              exit 1
            fi
            # `coverage` replays the tracked seed corpus once — it does not fuzz.
            cargo fuzz coverage --target x86_64-unknown-linux-gnu "$t" "$PWD/fuzz/seeds/$t"
            # cargo-fuzz's target-dir and profile layout vary across versions
            # (root target/ vs fuzz/target/, fuzz/coverage/ vs coverage/), so
            # discover both artifacts rather than hardcode a path.
            bin="$(find . -path "*/coverage/*/release/$t" -type f -perm -111 2>/dev/null | head -1)"
            prof="$(find . -path "*/$t/coverage.profdata" -type f 2>/dev/null | head -1)"
            if [ -z "$bin" ] || [ -z "$prof" ]; then
              echo "missing binary or profile for $t (bin=$bin prof=$prof)" >&2
              exit 1
            fi
            {
              echo "### $t"
              echo '```'
              "$llvm_cov" report "$bin" -instr-profile="$prof" -ignore-filename-regex="$ignore"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            "$llvm_cov" show "$bin" -instr-profile="$prof" \
              -format=html -output-dir="fuzz-cov/$t" \
              -ignore-filename-regex="$ignore" \
              -show-line-counts-or-regions
            echo "::endgroup::"
          done

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-coverage-report
          path: fuzz-cov/
          retention-days: 14
