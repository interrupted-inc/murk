name: Invariants

# Deep soak of tests/access_invariants.rs: random sequences of real murk
# commands, checked after every step for widened or dropped access, writes by
# refused commands, and vaults that fail `murk verify`. The CI test job runs
# the same test with a small case count on pull requests and pushes to main;
# this nightly run explores far more sequences. It is too slow for pull
# requests, so it runs on a schedule and on demand only.
on:
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC, after the fuzz run
  workflow_dispatch:
    inputs:
      cases:
        description: Number of random sequences to run
        required: false
        default: "25000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: Access invariants soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Aimed at about 20 minutes on ubuntu-latest in a release build: 1,000
      # cases took about 17 s in a 4-core Linux container, and this assumes a
      # hosted runner is 2-3x slower. Retune from the first nightly timings.
      MURK_INVARIANT_CASES: ${{ inputs.cases || '25000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo test --release --test access_invariants --no-run

      # proptest shrinks a failure to a minimal command sequence and prints it
      # with the broken invariant and murk's stderr; keep that output.
      - name: Soak
        run: |
          set -euo pipefail
          mkdir -p target/invariants
          cargo test --release --test access_invariants -- --nocapture 2>&1 \
            | tee target/invariants/soak.log

      - name: Upload the shrunk counterexample on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: access-invariants-counterexample
          path: target/invariants/soak.log
          retention-days: 14
